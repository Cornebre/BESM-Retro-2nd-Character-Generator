# =============================================================================
# BESM 2η Έκδοση — Διαμόρφωση δεδομένων παιχνιδιού (ΕΛΛΗΝΙΚΑ) (MT)
# Επεξεργαστείτε αυτό το αρχείο για να προσαρμόσετε το σύνολο κανόνων. Η εφαρμογή το διαβάζει κατά την εκκίνηση.
#
# ΚΑΝΟΝΕΣ ΜΕΤΑΦΡΑΣΗΣ:
#   - "key"  = εσωτερικός αναγνωριστικός κωδικός που χρησιμοποιείται στα αρχεία αποθήκευσης. ΜΗΝ τα αλλάζετε ΠΟΤΕ.
#              Για τα αγγλικά, key == name (δεν απαιτείται μετάφραση).
#   - "name" = συμβολοσειρά που εμφανίζεται στο περιβάλλον χρήστη για αυτή τη γλώσσα.
#   - Εάν το πεδίο "name" απουσιάζει, το πρόγραμμα χρησιμοποιεί το "key".
# =============================================================================

