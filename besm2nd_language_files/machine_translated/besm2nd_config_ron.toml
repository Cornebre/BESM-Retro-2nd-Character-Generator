# Which derived stat each attribute modifies (beyond its CP cost).
# stat      = which derived value is affected (CV (Increase both ACV and DCV), ACV, DCV, HP, EP, SP, SV (Shock Value))
# per_level = how much it changes per attribute level
[attr_modifies]
'Combat Mastery' = { stat = 'CV',  per_level = 1  }
'Damn Healthy!'  = { stat = 'HP',  per_level = 10 }
'Energy Bonus'   = { stat = 'EP',  per_level = 10 }
