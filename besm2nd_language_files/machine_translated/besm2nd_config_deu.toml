# Stat-Kostenformeln. Jeder Eintrag benötigt einen Anzeigenamen "name" und einen
# Python-Ausdruck "expression" in Abhängigkeit von v (dem Statwert).
# Die App kompiliert diese beim Start und erstellt daraus den Formel-Selektor.
[stat_formulas]

[[stat_formulas.entries]]
key   = "Default"
name  = "Standard"
# Linear: jeder Punkt kostet 1 CP unabhängig von der Stufe.
expression = "v"

[[stat_formulas.entries]]
key   = "Free, then Three"
name  = "Frei, dann Drei"
# Die ersten 4 Punkte sind kostenlos; jeder Punkt über 4 kostet 3 CP.
expression = "0 if v <= 4 else (v - 4) * 3"

[[stat_formulas.entries]]
key   = "Bracket"
name  = "Staffelung"
# v 1-4: je 1 CP; v 5-8: je 2 CP; v 9+: je 4 CP (kumulativ).
expression = """
if v <= 4: return v
if v <= 8: return 4 + (v - 4) * 2
return 4 + 8 + (v - 8) * 4
"""

# Attribut-/Waffenkostenformeln. Jeder Eintrag benötigt einen Anzeigenamen "name"
# und einen Python-Ausdruck "expression" in Abhängigkeit von base_cost und level.
[attr_formulas]

[[attr_formulas.entries]]
key   = "Default"
name  = "Standard"
# Linear: Gesamtkosten = base_cost × level.
expression = "base_cost * level"

[[attr_formulas.entries]]
key   = "Triangular"
name  = "Dreieckig"
# Dreieckig: jede weitere Stufe kostet base_cost mehr als die vorherige.
# Stufe 1 = Basis, Stufe 2 = 3×Basis, Stufe 3 = 6×Basis, Stufe 4 = 10×Basis …
expression = "base_cost * level * (level + 1) // 2"

