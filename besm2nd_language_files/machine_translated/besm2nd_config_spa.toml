# Fórmulas de coste de stats. Cada entrada necesita un "name" de visualización
# y una "expression" en Python en términos de v (el valor del stat).
[stat_formulas]

[[stat_formulas.entries]]
key   = "Default"
name  = "Estándar"
# Lineal: cada punto cuesta 1 PC independientemente del nivel.
expression = "v"

[[stat_formulas.entries]]
key   = "Free, then Three"
name  = "Gratis, luego Tres"
# Los primeros 4 puntos son gratuitos; cada punto por encima de 4 cuesta 3 PC.
expression = "0 if v <= 4 else (v - 4) * 3"

[[stat_formulas.entries]]
key   = "Bracket"
name  = "Escalonado"
# v 1-4: 1 PC cada uno; v 5-8: 2 PC cada uno; v 9+: 4 PC cada uno (acumulativo).
expression = """
if v <= 4: return v
if v <= 8: return 4 + (v - 4) * 2
return 4 + 8 + (v - 8) * 4
"""

# Fórmulas de coste de atributos/armas.
[attr_formulas]

[[attr_formulas.entries]]
key   = "Default"
name  = "Estándar"
# Lineal: coste total = base_cost × nivel.
expression = "base_cost * level"

[[attr_formulas.entries]]
key   = "Triangular"
name  = "Triangular"
# Triangular: cada nivel sucesivo cuesta base_cost más que el anterior.
expression = "base_cost * level * (level + 1) // 2"

