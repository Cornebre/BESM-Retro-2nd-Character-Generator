# =============================================================================
# BESM 2판 — 게임 데이터 구성 파일 (한국어) (MT)
# 규칙 세트를 사용자 정의하려면 이 파일을 편집하십시오. 앱은 시작 시 이 파일을 읽습니다.
#
# 번역 규칙:
#   - "key"  = 저장 파일에 사용되는 내부 식별자입니다. 절대로 변경하지 마십시오.
#              영어의 경우, key == name (번역 필요 없음).
#   - "name" = 해당 언어의 UI에 표시되는 문자열입니다.
#   - "name" 필드가 없는 경우, 프로그램은 "key"를 대신 사용합니다.
# 
# =============================================================================

