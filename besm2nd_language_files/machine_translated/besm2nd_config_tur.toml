# =============================================================================
# BESM 2. Baskı — Oyun Veri Yapılandırması (TÜRKÇE) (MT)
# Kural setini özelleştirmek için bu dosyayı düzenleyin. Uygulama, başlangıçta bu dosyayı okur.
#
# ÇEVİRİ KURALLARI:
#   - "key"  = kayıt dosyalarında kullanılan dahili tanımlayıcı. Bunları ASLA değiştirmeyin.
#              İngilizce için, key == name (çeviriye gerek yoktur).
#   - "name" = bu dil için kullanıcı arayüzünde gösterilen metin dizesi.
#   - "name" alanı yoksa, program "key" değerini kullanır.
# 
# =============================================================================

