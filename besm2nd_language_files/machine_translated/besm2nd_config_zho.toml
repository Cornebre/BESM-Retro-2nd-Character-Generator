# =============================================================================
# BESM 第2版 — 游戏数据配置文件（简体中文）（MT）
# 编辑此文件以自定义规则集。应用程序会在启动时读取该文件。
#
# 翻译规则：
#   - "key"  = 存档文件中使用的内部标识符。切勿更改这些。
#              对于英文，key == name（无需翻译）。
#   - "name" = 该语言在用户界面中显示的字符串。
#   - 若缺少 "name" 字段，程序将默认使用 "key"。
# 
# =============================================================================

