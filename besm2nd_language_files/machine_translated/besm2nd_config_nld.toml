# VERTAALREGELS:
#   - "key"  = interne identificatiecode die in opslagbestanden wordt gebruikt. Wijzig deze NOOIT.
#              Voor het Engels geldt: key == naam (vertaling niet nodig).
#   - "name" = weergavetekst die in de gebruikersinterface voor deze taal wordt getoond.
#   - Als het veld "name" ontbreekt, valt het programma terug op "key".
# 
# =============================================================================

