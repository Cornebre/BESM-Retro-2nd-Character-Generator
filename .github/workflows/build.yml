name: Build & Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller reportlab

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $addData = @()
          Get-ChildItem -Path "besm2nd_language_files" -Filter "besm2nd_config_*.toml" |
            ForEach-Object { $addData += "--add-data `"$($_.FullName);language_files`"" }
          Get-ChildItem -Path "besm2nd_language_files/machine_translated" -Filter "besm2nd_config_*.toml" |
            ForEach-Object { $addData += "--add-data `"$($_.FullName);language_files/machine_translated`"" }
          $addData += "--add-data `"BESM2nd_Native_Arsenal.json;.`""
          $addData += "--add-data `"BESM2_Retro_logo_dtrpg_250px.png;.`""
          $cmd = "pyinstaller --onefile --noconsole " + ($addData -join " ") + " --name BESM2nd_CharGen BESM2nd_CharGen.py"
          Invoke-Expression $cmd

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          ADD_DATA=""
          for f in besm2nd_language_files/besm2nd_config_*.toml; do
            ADD_DATA="$ADD_DATA --add-data \"$f:language_files\""
          done
          for f in besm2nd_language_files/machine_translated/besm2nd_config_*.toml; do
            ADD_DATA="$ADD_DATA --add-data \"$f:language_files/machine_translated\""
          done
          ADD_DATA="$ADD_DATA --add-data \"BESM2nd_Native_Arsenal.json:.\""
          ADD_DATA="$ADD_DATA --add-data \"BESM2_Retro_logo_dtrpg_250px.png:.\""
          eval pyinstaller --onefile $ADD_DATA --name BESM2nd_CharGen BESM2nd_CharGen.py

      - name: Upload to Release (Windows)
        if: runner.os == 'Windows' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BESM2nd_CharGen.exe

      - name: Upload to Release (Linux)
        if: runner.os == 'Linux' && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BESM2nd_CharGen